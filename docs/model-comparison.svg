<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="800" height="420" rx="16" fill="#0d1117"/>
  <text x="40" y="50" fill="#f0f6fc" font-size="22" font-weight="700">Model comparison · Telco customer churn</text>
  <text x="40" y="74" fill="#8b949e" font-size="13">Test set of 1,409 customers · higher is better</text>

  <rect x="560" y="32" width="14" height="14" rx="3" fill="#818cf8"/>
  <text x="580" y="44" fill="#c9d1d9" font-size="13">Accuracy</text>
  <rect x="660" y="32" width="14" height="14" rx="3" fill="#f59e0b"/>
  <text x="680" y="44" fill="#c9d1d9" font-size="13">F1 score</text>

  <!-- Logistic Regression (best) -->
  <text x="130" y="139" fill="#f0f6fc" font-size="14" font-weight="700" text-anchor="end">Logistic Regression ★</text>
  <rect x="150" y="110" width="478.6" height="26" rx="6" fill="#818cf8"/>
  <text x="636.6" y="128" fill="#f0f6fc" font-size="13">79.8%</text>
  <rect x="150" y="140" width="348.9" height="26" rx="6" fill="#f59e0b"/>
  <text x="506.9" y="158" fill="#f0f6fc" font-size="13">58.2%</text>

  <!-- Random Forest -->
  <text x="130" y="209" fill="#c9d1d9" font-size="14" text-anchor="end">Random Forest</text>
  <rect x="150" y="180" width="466.3" height="26" rx="6" fill="#818cf8"/>
  <text x="624.3" y="198" fill="#f0f6fc" font-size="13">77.7%</text>
  <rect x="150" y="210" width="326.9" height="26" rx="6" fill="#f59e0b"/>
  <text x="484.9" y="228" fill="#f0f6fc" font-size="13">54.5%</text>

  <!-- KNN -->
  <text x="130" y="279" fill="#c9d1d9" font-size="14" text-anchor="end">K-Nearest Neighbors</text>
  <rect x="150" y="250" width="460.7" height="26" rx="6" fill="#818cf8"/>
  <text x="618.7" y="268" fill="#f0f6fc" font-size="13">76.8%</text>
  <rect x="150" y="280" width="311.9" height="26" rx="6" fill="#f59e0b"/>
  <text x="469.9" y="298" fill="#f0f6fc" font-size="13">52.0%</text>

  <!-- Decision Tree -->
  <text x="130" y="349" fill="#c9d1d9" font-size="14" text-anchor="end">Decision Tree</text>
  <rect x="150" y="320" width="433.5" height="26" rx="6" fill="#818cf8"/>
  <text x="591.5" y="338" fill="#f0f6fc" font-size="13">72.3%</text>
  <rect x="150" y="350" width="294.9" height="26" rx="6" fill="#f59e0b"/>
  <text x="452.9" y="368" fill="#f0f6fc" font-size="13">49.2%</text>

  <text x="40" y="402" fill="#8b949e" font-size="12">Source: churn-prediction/results.txt · random_state=42 · stratified 80/20 split</text>
</svg>
